<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes</title>
</head>
<style>
    .country {
        background-color: lightblue;
        color: black;
        border: 1px solid black;
        padding: 10px;
        margin: 10px;
        font-size: 18px;
    }
    .city {
        background-color: lightgreen;
        color: black;
        border: 1px solid red;
        padding: 20px;
        margin: 40px;
        font-size: 18px;
    }
    .area {
        background-color: lightyellow;
        color: black;
        border: 1px solid black;
        padding: 10px;
        margin: 10px;
        font-size: 18px;
    }
    .main {
        text-align: center;
    }
</style>
<body>
    <div>
        <h2 class="country main">Pakistan</h2>
        <p>Pakistan is a country in South Asia.</p>
    </div>
    <div class="city">
        <h2>India</h2>
        <p>India is a country in South Asia.</p>
    </div>
    <div class="area">
        <h2>United States</h2>
        <p>The United States is a <span class="country">country</span> in North America.</p>
        </div>
</body>
</html>
